[package]
name = "pics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
directories = "6"
blake3 = "1"
kamadak-exif = "0.6.1"
gpui = "0.2.2"
futures = "0.3"
heif-rs = "26.7.0"
image = { version = "0.25", features = ["avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
jpeg-decoder = "0.3.2"
rawler = { git = "https://github.com/vigoo/dnglab.git", rev = "e7a2ad7fb627a99a1e846d02bca8993371fd90fa" }
priority-queue = "2"
rayon = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
smallvec = "1"
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
