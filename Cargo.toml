[package]
name = "rekesz"
version = "0.1.0"
edition = "2024"

[features]
default = ["mtp", "ptp"]
# MTP device detection via libmtp (Linux/macOS; Windows uses the in-box WPD
# API and does not need this feature). Requires the libmtp development files.
mtp = ["dep:libmtp-rs"]
# PTP camera access via libgphoto2 (Linux/macOS; Windows cameras go through
# the WPD backend). Requires the libgphoto2 development files.
ptp = ["dep:gphoto2"]

[dependencies]
anyhow = "1"
accesskit = "0.25"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
directories = "6"
blake3 = "1"
kamadak-exif = "0.6.1"
gpui = "0.2.2"
hnsw_rs = "0.3.4"
hex = "0.4"
futures = "0.3"
fast-mvt = { version = "0.6.2", default-features = false, features = ["reader"] }
geojson = "1.0"
# Supercluster 3 exposes GeoJSON 0.24 types in its public API.
geojson_legacy = { package = "geojson", version = "=0.24.2" }
tiny-skia = "0.12"
libheif-rs = { version = "3", features = ["embedded-libheif"] }
libheif-sys = "5.3.1"
image = { version = "0.25", features = ["avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
# xattr 0.2.3, pulled in by gpui's zed-async-tar, uses libc::ENOATTR on Linux.
# libc 0.2.190 removed that alias, so keep the last compatible release for now.
libc = "=0.2.189"
jpeg-decoder = "0.3.2"
moxcms = "0.9.1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
rawler = { git = "https://github.com/vigoo/dnglab.git", rev = "e7a2ad7fb627a99a1e846d02bca8993371fd90fa" }
priority-queue = "2"
rayon = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "functions"] }
smallvec = "1"
supercluster = { version = "3.0.8", features = ["cluster_metadata"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

# Face-model inference uses the CUDA execution provider where the bundled
# ONNX Runtime binaries ship one (x86_64 Linux and Windows). Other targets,
# notably macOS, keep the CPU-only build. Availability is still detected at
# runtime: face analysis falls back to CPU when the NVIDIA driver or the
# CUDA/cuDNN userland libraries are missing.
[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-rustls",
    "cuda",
] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "0.24"

[target.'cfg(unix)'.dependencies]
libmtp-rs = { version = "0.7.7", optional = true }
# Pinned exactly: the ptp backend leans on this crate's `Future` impl and
# `Task::cancel` reachability (see ptp-camera-plan.md).
gphoto2 = { version = "=3.4.1", optional = true }

[build-dependencies]
hex = "0.4"
sha2 = "0.11"

[[bin]]
name = "rekesz"
path = "src/main.rs"
harness = false

[[bin]]
name = "lightroom-inventory"
path = "src/bin/lightroom_inventory.rs"
harness = false

[[bin]]
name = "people-resource-supervisor"
path = "src/bin/people_resource_supervisor.rs"
harness = false
test = false

[[bin]]
name = "people-test-artifacts"
path = "src/bin/people_test_artifacts.rs"
harness = false
test = false

[[bin]]
name = "lens-profile-calibrate"
path = "src/bin/lens_profile_calibrate.rs"
harness = false
test = false

[[bin]]
name = "sface-calibration-embeddings"
path = "src/bin/sface_calibration_embeddings.rs"
harness = false
test = false

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
test-r = { version = "3.0.12", default-features = false }
