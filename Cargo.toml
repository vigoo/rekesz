[package]
name = "pics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
directories = "6"
blake3 = "1"
kamadak-exif = "0.6.1"
gpui = "0.2.2"
heif-rs = "26.7.0"
image = { version = "0.25", features = ["avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
rawler = { git = "https://github.com/vigoo/dnglab.git", rev = "95a0b481821639c7fc546b4196fea5fa293ae682" }
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
