[package]
name = "rekesz"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
accesskit = "0.25"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
directories = "6"
blake3 = "1"
kamadak-exif = "0.6.1"
gpui = "0.2.2"
hnsw_rs = "0.3.4"
futures = "0.3"
fast-mvt = { version = "0.6.2", default-features = false, features = ["reader"] }
geojson = "0.24"
tiny-skia = "0.11"
libheif-rs = { version = "3", features = ["embedded-libheif"] }
libheif-sys = "5.3.1"
image = { version = "0.25", features = ["avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
libc = "0.2"
jpeg-decoder = "0.3.2"
moxcms = "0.8.1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
rawler = { git = "https://github.com/vigoo/dnglab.git", rev = "e7a2ad7fb627a99a1e846d02bca8993371fd90fa" }
priority-queue = "2"
rayon = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "functions"] }
smallvec = "1"
supercluster = { version = "3.0.8", features = ["cluster_metadata"] }
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "0.23"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "rekesz"
path = "src/main.rs"
harness = false

[[bin]]
name = "lightroom-inventory"
path = "src/bin/lightroom_inventory.rs"
harness = false

[[bin]]
name = "people-resource-supervisor"
path = "src/bin/people_resource_supervisor.rs"
harness = false
test = false

[[bin]]
name = "people-test-artifacts"
path = "src/bin/people_test_artifacts.rs"
harness = false
test = false

[[bin]]
name = "sface-calibration-embeddings"
path = "src/bin/sface_calibration_embeddings.rs"
harness = false
test = false

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
test-r = { version = "3.0.10", default-features = false }
