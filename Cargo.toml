[package]
name = "pics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
directories = "6"
blake3 = "1"
kamadak-exif = "0.6.1"
gpui = "0.2.2"
futures = "0.3"
libheif-rs = { version = "3", features = ["embedded-libheif"] }
image = { version = "0.25", features = ["avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
jpeg-decoder = "0.3.2"
moxcms = "0.8.1"
rawler = { git = "https://github.com/vigoo/dnglab.git", rev = "e7a2ad7fb627a99a1e846d02bca8993371fd90fa" }
priority-queue = "2"
rayon = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
smallvec = "1"
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "pics"
path = "src/main.rs"
harness = false

[[bin]]
name = "lightroom-inventory"
path = "src/bin/lightroom_inventory.rs"
harness = false

[dev-dependencies]
test-r = { version = "3.0.10", default-features = false }
