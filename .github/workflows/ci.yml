name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # gpui needs freetype/fontconfig/xkbcommon/xkbcommon-x11/wayland/x11 to
      # link, and blade-graphics needs libvulkan; libmtp backs the MTP source
      # provider and libgphoto2 the PTP camera provider.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype-dev \
            libfontconfig-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libvulkan-dev \
            libmtp-dev \
            libgphoto2-dev \
            pkg-config

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install libmtp libgphoto2 pkg-config

      # libheif-sys resolves libheif through vcpkg on Windows/MSVC (its vendored
      # CMake build only covers the other platforms); the runner image ships
      # vcpkg at VCPKG_INSTALLATION_ROOT. x64-windows-static-md is the triplet
      # the vcpkg crate links against by default and matches libheif-sys's own
      # package metadata (libheif[aom]). The restored installed tree carries
      # vcpkg's status database, so `vcpkg install` becomes a fast no-op on
      # cache hits and the fresh install is saved at job end on misses.
      - name: Restore vcpkg libheif
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-aom-x64-windows-static-md

      - name: Install Windows packages (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "libheif[aom]:x64-windows-static-md"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      # Formatting is platform-independent; one pass is enough.
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
