name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # gpui needs freetype/fontconfig/xkbcommon/wayland/x11 to link, and
      # blade-graphics needs libvulkan; libmtp backs the MTP source provider
      # and libgphoto2 the PTP camera provider.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype-dev \
            libfontconfig-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libvulkan-dev \
            libmtp-dev \
            libgphoto2-dev \
            pkg-config

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install libmtp libgphoto2 pkg-config

      - uses: Swatinem/rust-cache@v2

      # Formatting is platform-independent; one pass is enough.
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
